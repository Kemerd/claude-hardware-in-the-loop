; HilTwin host project engine settings.
; The ChaosTorque coupling runs the twin inside Chaos' async physics step, which must equal the twin step (the
; firmware tick, 1 ms). Kinematic coupling does not need these, but keeping them on means one project runs both.
[/Script/Engine.PhysicsSettings]
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.001
MaxSubstepDeltaTime=0.001

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Engine.GameModeBase
